      The service is undergoing scheduled maintenance, and is not available. Check back in 15 minutes.

feedback:
  interviewer-support-warning:
    title: Information
    content: If your issue is urgent, contact the Survey Enquiry Team (SET) on 0800 652 4568
  form:
    comments:
      label: >-
        {category, select,
          support     {Issue details}
          other       {Comments}
        }
      help:
        feedback: ''
        support: |-
          Provide as much information as possible.
          
          If you are reporting a bug, please include what you were doing, and what happened.
    email:
      help: >-
        {category, select,
          support     {}
          other       {We will be able to reply if you provide an email address}
        }
      label: Email address
    send.label: >-
      {category, select,
        support     {Request support}
        other       {Send feedback}
      }
    page-title: >-
      {category, select,
        support     {Request support}
        other       {Feedback}
      }
    notes: >-
      {category, select,
        support     {
          When submitting this form, your email address and comments will be viewable by staff working on the National Travel Survey at the National Centre for Social Research (NatCen), the Department for Transport and Ghost Digital Ltd. If a response is needed, you will be contacted by email.

          Alternatively, you can contact NatCen by telephone on 0800 652 4568.
        }
        other       {}
      }
  thanks:
    page-title: Thanks!
    copy: >-
      {category, select,
        support     {Your support request has been successfully submitted. Someone will get back to you as soon as possible.}
        other       {Your feedback has been successfully submitted}
      }

