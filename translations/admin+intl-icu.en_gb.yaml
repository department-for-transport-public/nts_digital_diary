data-export:
  page-title: Data export

feedback:
  assignment:
    page-title: Assign messages
    message.page-title: Assign {category} message
    success-notification:
      heading: Message assigned
      content: The message was assigned to {assignedTo}
    cancel-link.label: Back to dashboard
    reject-button.label: Reject message
    submit-button.label: Assign message
    choice.placeholder: -- select --

  breadcrumbs:
    message: "Message {id}"
    message-lookup: Message lookup
    view-messages: Feedback messages

  message-lookup:
      page-title: Message lookup
      help: This utility allows a message to be found given its message ID.

  stats:
    page-title: Feedback stats
    support.label: Support
    feedback.label: Feedback

  view:
    list.page-title: Feedback dashboard
    message.page-title: View {category} message
    details:
      id: ID
      message: Message
      timestamp: Received
      state: State
      email: Email address
      user: User
      impersonator: Impersonator
      category: Category
      assigned-to: Assigned to
      page: Page URL
      user-serial:
        int: Interviewer - {serial}
        dk: Diary keeper - {serial}
    state:
      colours:
        new: orange
        assigned: blue
        in-progress: green
        closed: grey
        rejected: red
      labels:
        new: New
        assigned: Assigned
        in-progress: In progress
        closed: Closed
        rejected: Rejected
    add-note:
      submit.label: Add note
  state-transition:
    acknowledge:
      label: Mark as in progress
      page-title: Mark message as in progress
      content: This will acknowledge that you have received the feedback, and that a response is in progress.
      confirmed-notification:
        heading: Message in-progress
        content: The message has been marked as in-progress.
    close:
      label: Close message
      page-title: Close message
      content: This will close the message.
      confirmed-notification:
        heading: Message closed
        content: The message has been closed.
    reopen:
      label: Re-open message
      page-title: Re-open message
      content: This will re-open the message.
      confirmed-notification:
        heading: Message re-opened
        content: The message has been re-opened.


