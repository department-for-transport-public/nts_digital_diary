actions:
  change-email: Change email

link-invalid:
  flash-notification:
    title: 'Invalid/expired link'
    heading: ''
    content: 'The link you followed was either invalid or has expired.'

change-email:
  page-title: Change email address for {name}
  breadcrumb: Change email address for {name}
  change-email: Change email address
  email:
    label: New email address
    help: Submitting this form will send a new account setup email to the email address entered. Once the user has followed the link and setup a password, the new address will be stored as their login username.

  success-banner:
    heading: "Email address change initiated"
    content: "An email containing a secure link has been sent to {newAddress}. Once the user has followed the link and set a password, the new address will be confirmed and updated."

change-password:
  page-title: Reset password

  access-denied: Access denied

  logged-in-as-another-user: >-
    Cannot reset password whilst logged in as another user.  
      
    [Log out]({url}) and then try again.

  success-banner:
    heading: "Password reset"
    content: "Your password has been successfully changed."

forgotten-password:
  page-title: Forgotten password

  email:
    label: Enter your email address
    help: ''

  reset-password: Reset password

  success-banner:
    heading: "Password reset request submitted"
    content: "If your email address was valid, an email will be sent to you."

setup:
  page-title-diary: Set password for Travel Diary account
  page-title-interviewer: Set password for Interviewer account

  success-banner:
    heading: "Setup complete"
    content: "Your password was successfully set."

setup-link-expired:
  page-title: Account setup link expired
  intro: |-
    The link you followed has expired.

    {emailSent, select,
      1     {A new link has been sent to your email address ({obfuscatedEmailAddress})}
      other {A new link was sent to your email address ({obfuscatedEmailAddress}) recently}
    }.
  instruction: |-
    Use the new link in order to complete the account setup process and access your travel diary.
  password-already-set-intro: |-
    The link you followed has expired.
  password-already-set-instruction: |-
    You already have an account. You can [log in](/login) to access your travel diary.


pre-auth:
  page-title: Travel diary access
  help: >-
    Click the button below to access the digital diary.

pre-password-reset:
  page-title: Travel diary password reset
  help: >-
    Click the button below to reset your password.
