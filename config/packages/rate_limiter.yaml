services:
    limiter.api:
        class: App\Limiter\ApiRequestLimiter
        autowire: true

    limiter.login:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.ip'
            $localFactory: '@limiter.ip_and_username'
            $secret: '%env(APP_SECRET)%'

    limiter.onboarding_login:
        class: App\Security\OneTimePassword\RateLimiter
        arguments:
            $globalFactory: '@limiter.ip'
            $localFactory: '@limiter.ip_and_username'

# Cache overridden in cache.yaml
framework:
    rate_limiter:
        api_key:
            policy: 'sliding_window'
            limit: 5
            interval: '1 minute'
        api_ip:
            policy: 'sliding_window'
            limit: 5
            interval: '1 minute'
        ip:
            policy: 'sliding_window'
            limit: 15
            interval: '5 minutes'
        ip_and_username:
            policy: 'sliding_window'
            limit: 5
            interval: '5 minutes'
        forgotten_password_email:
            policy: 'sliding_window'
            limit: 2
            interval: '10 minutes'
        forgotten_password_ip:
            policy: 'sliding_window'
            limit: 5
            interval: '10 minutes'
        account_creation_link_expired:
            policy: 'sliding_window'
            limit: 1
            interval: '3 days'
        account_activation_link_reuse:
            policy: 'sliding_window'
            limit: 10
            interval: '1 month' # signed account activation urls last a couple of weeks at most. One token is spent per fresh session, so this limits a URL to 10 uses.